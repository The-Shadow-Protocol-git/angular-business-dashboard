<section class="page">
  <div class="page-heading"><div><p class="eyebrow">WORKSPACE</p><h2>Products</h2><p class="subheading">Manage your catalog, pricing, and stock levels.</p></div><a class="button primary" routerLink="/products/new">＋ Add product</a></div>
  <section class="panel">
    <div class="toolbar">
      <label class="search"><span aria-hidden="true">⌕</span><input type="search" placeholder="Search products…" aria-label="Search products" [value]="query()" (input)="search($event)" /></label>
      <label class="filter">Category <select aria-label="Filter products by category" [value]="category()" (change)="filterCategory($event)"><option value="all">All categories</option>@for (item of categories(); track item) { <option [value]="item">{{ item }}</option> }</select></label>
      <label class="filter">Stock <select aria-label="Filter products by stock" [value]="stock()" (change)="filterStock($event)"><option value="all">All stock</option><option value="in-stock">In stock</option><option value="low-stock">Low stock (10 or fewer)</option><option value="out-of-stock">Out of stock</option></select></label>
    </div>
    @if (loading()) { <app-loading-state message="Loading products…" /> }
    @else if (error()) { <app-error-state [message]="error()" (retry)="load()" /> }
    @else if (visibleProducts().length === 0) { <app-empty-state [title]="products().length ? 'No matching products' : 'No products yet'" [description]="products().length ? 'Try changing the search or product filters.' : 'Add a product to build your catalog.'" /> }
    @else { <app-data-table [rows]="visibleProducts()" [columns]="columns" [trackBy]="productId" (view)="viewProduct($event)" (edit)="editProduct($event)" (remove)="deleteProduct($event)" /> }
  </section>
</section>
