<section class="dashboard">
  @if (loading()) {
    <div class="state-panel" role="status"><span class="spinner"></span>Loading your business overview…</div>
  } @else if (error()) {
    <div class="state-panel error-state" role="alert"><p>{{ error() }}</p><button class="button primary" (click)="load()">Try again</button></div>
  } @else if (data(); as dashboard) {
    <section class="stats-grid" aria-label="Business performance">
      @for (stat of stats(); track stat.label) {
        <app-stat-card [label]="stat.label" [value]="stat.value" [change]="stat.change" [icon]="stat.icon" [prefix]="stat.prefix ?? ''" [suffix]="stat.suffix ?? ''" />
      }
    </section>
    <section class="content-grid">
      <app-revenue-overview [points]="revenue()" [range]="range()" (rangeChange)="changeRange($event)" />
      <app-recent-orders [orders]="dashboard.recentOrders" />
    </section>
  }
</section>
