<section class="form-page">
  <a class="back-link" [routerLink]="['/', type]">← Back to {{ type }}</a>
  <div class="form-heading"><p class="eyebrow">WORKSPACE / {{ type }}</p><h2>{{ title }}</h2><p>Enter the details below. Required fields are marked.</p></div>
  @if (loading()) {
    <div class="card form-state" role="status">Loading record…</div>
  } @else {
    <form class="card" [formGroup]="form" (ngSubmit)="save()" novalidate>
      @if (error()) { <div class="form-error" role="alert">{{ error() }}</div> }
      @if (type === 'orders') {
        <div class="form-grid">
          <label>Customer <span>*</span>
            <select formControlName="customerId">
              <option value="">Select a customer</option>
              @for (customer of customers(); track customer.id) { <option [value]="customer.id">{{ customer.name }} — {{ customer.email }}</option> }
            </select>
            @if (hasError('customerId')) { <small class="field-error">Choose a customer.</small> }
          </label>
          <label>Product <span>*</span>
            <select formControlName="productId" (change)="setOrderTotal()">
              <option value="">Select a product</option>
              @for (product of products(); track product.id) { <option [value]="product.id" [disabled]="product.status !== 'active' || product.stock === 0">{{ product.name }} — {{ product.price | currency }} ({{ product.stock }} in stock)</option> }
            </select>
            @if (hasError('productId')) { <small class="field-error">Choose an available product.</small> }
          </label>
          <label>Quantity <span>*</span><input type="number" min="1" step="1" formControlName="quantity" (change)="setOrderTotal()" />@if (hasError('quantity')) { <small class="field-error">Enter a whole number within the available stock.</small> }</label>
          <label>Total (USD) <span>*</span><input type="number" formControlName="total" readonly aria-describedby="total-help" /> <small id="total-help" class="hint">Calculated from the selected product and quantity.</small>@if (hasError('total')) { <small class="field-error">Choose a product and valid quantity.</small> }</label>
          <label>Status <span>*</span>
            <select formControlName="status"><option value="pending">Pending</option><option value="processing">Processing</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select>
          </label>
        </div>
      } @else if (type === 'customers') {
        <div class="form-grid">
          <label>Full name <span>*</span><input type="text" formControlName="name" autocomplete="name" placeholder="Customer name" />@if (hasError('name')) { <small class="field-error">Name is required (maximum 100 characters).</small> }</label>
          <label>Email address <span>*</span><input type="email" formControlName="email" autocomplete="email" placeholder="name@company.com" />@if (hasError('email')) { <small class="field-error">Enter a valid email address.</small> }</label>
          <label>Phone number <span>*</span><input type="tel" formControlName="phone" autocomplete="tel" placeholder="+1 555 000 0000" />@if (hasError('phone')) { <small class="field-error">Phone number is required (maximum 30 characters).</small> }</label>
          <label>Status <span>*</span><select formControlName="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></label>
        </div>
      } @else {
        <div class="form-grid">
          <label>Product name <span>*</span><input type="text" formControlName="name" placeholder="Product name" />@if (hasError('name')) { <small class="field-error">Product name is required (maximum 100 characters).</small> }</label>
          <label>SKU <span>*</span><input type="text" formControlName="sku" placeholder="SKU-000" />@if (hasError('sku')) { <small class="field-error">SKU is required (maximum 40 characters).</small> }</label>
          <label>Price (USD) <span>*</span><input type="number" min="0.01" step="0.01" formControlName="price" placeholder="0.00" />@if (hasError('price')) { <small class="field-error">Enter an amount greater than zero (up to 2 decimals).</small> }</label>
          <label>Stock quantity <span>*</span><input type="number" min="0" step="1" formControlName="stock" placeholder="0" />@if (hasError('stock')) { <small class="field-error">Enter a whole number of zero or more.</small> }</label>
          <label>Category <span>*</span><input type="text" formControlName="category" placeholder="e.g. Accessories" />@if (hasError('category')) { <small class="field-error">Category is required (maximum 60 characters).</small> }</label>
          <label>Status <span>*</span><select formControlName="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></label>
        </div>
      }
      <div class="form-actions"><a class="button secondary" [routerLink]="['/', type]">Cancel</a><button class="button primary" type="submit" [disabled]="saving()">{{ saving() ? 'Saving…' : (id ? 'Save changes' : 'Create ' + type.slice(0, -1)) }}</button></div>
    </form>
  }
</section>
